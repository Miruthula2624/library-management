# ===================================================================
# College Library Management System - Backend Configuration
# ===================================================================

server.port=8080

# Application Name
spring.application.name=College-Library-Management-System

# ===================================================================
# MySQL Database Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/library_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

# >>> ENTER YOUR MYSQL PASSWORD HERE <<<
# Replace YOUR_PASSWORD with your actual MySQL root password
spring.datasource.password=YOUR_PASSWORD

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
